<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="tmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#tmsBg)"/>

  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="260" y1="0" x2="260" y2="500"/>
    <line x1="530" y1="0" x2="530" y2="500"/>
  </g>

  <!-- Dashboard Window -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <!-- Header -->
    <rect width="680" height="42" rx="12" fill="#1e293b"/>
    <rect y="30" width="680" height="12" fill="#1e293b"/>
    <circle cx="25" cy="21" r="6" fill="#ef4444"/>
    <circle cx="45" cy="21" r="6" fill="#eab308"/>
    <circle cx="65" cy="21" r="6" fill="#22c55e"/>
    
    <text x="340" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">TMS • Training Management System (Angular + .NET API)</text>

    <!-- Sidebar -->
    <rect x="0" y="42" width="160" height="368" fill="#111827"/>
    <line x1="160" y1="42" x2="160" y2="410" stroke="#1f2937" stroke-width="2"/>
    
    <rect x="15" y="65" width="130" height="28" rx="6" fill="#2563eb" opacity="0.2"/>
    <text x="35" y="83" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">📊 Dashboard</text>
    <text x="35" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">📚 Courses</text>
    <text x="35" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">👥 Trainees</text>
    <text x="35" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">🔐 Roles &amp; RBAC</text>
    <text x="35" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">📈 Reports</text>

    <!-- Main Content Area -->
    <g transform="translate(180, 60)">
      <!-- KPI stats -->
      <rect x="0" y="0" width="145" height="75" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="15" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Active Courses</text>
      <text x="15" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">24</text>
      
      <rect x="165" y="0" width="145" height="75" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="180" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Enrolled Trainees</text>
      <text x="180" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">380+</text>

      <rect x="330" y="0" width="145" height="75" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="345" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Completion Rate</text>
      <text x="345" y="55" fill="#34d399" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">96.4%</text>

      <!-- Table / Trainee list -->
      <rect x="0" y="95" width="475" height="225" rx="8" fill="#1e293b" stroke="#334155"/>
      <rect x="0" y="95" width="475" height="35" rx="8" fill="#0f172a"/>
      <rect y="120" width="475" height="10" fill="#0f172a"/>
      <text x="20" y="117" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Course Name</text>
      <text x="190" y="117" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Instructor</text>
      <text x="330" y="117" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Status</text>
      <text x="415" y="117" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Enrolled</text>

      <!-- Row 1 -->
      <text x="20" y="155" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">C# .NET Enterprise API</text>
      <text x="190" y="155" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Lead Architect</text>
      <rect x="325" y="142" width="55" height="18" rx="4" fill="#22c55e" opacity="0.2"/>
      <text x="352" y="155" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Active</text>
      <text x="425" y="155" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">42</text>

      <!-- Row 2 -->
      <line x1="0" y1="175" x2="475" y2="175" stroke="#334155" stroke-width="0.7"/>
      <text x="20" y="200" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Angular Architecture</text>
      <text x="190" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Senior Engineer</text>
      <rect x="325" y="187" width="55" height="18" rx="4" fill="#22c55e" opacity="0.2"/>
      <text x="352" y="200" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Active</text>
      <text x="425" y="200" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">38</text>

      <!-- Row 3 -->
      <line x1="0" y1="220" x2="475" y2="220" stroke="#334155" stroke-width="0.7"/>
      <text x="20" y="245" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">PostgreSQL Database Optimization</text>
      <text x="190" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">DB Admin</text>
      <rect x="325" y="232" width="65" height="18" rx="4" fill="#3b82f6" opacity="0.2"/>
      <text x="357" y="245" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Scheduled</text>
      <text x="425" y="245" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">50</text>
    </g>
  </g>
</svg>
