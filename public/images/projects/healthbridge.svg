<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="hbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26"/>
      <stop offset="50%" stop-color="#0b2938"/>
      <stop offset="100%" stop-color="#06131c"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#hbBg)"/>

  <!-- Health grid lines -->
  <g stroke="#164e63" stroke-width="1" opacity="0.4">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Pulse waveform -->
  <path d="M 0 250 L 250 250 L 270 210 L 290 290 L 310 180 L 330 310 L 350 250 L 800 250" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3"/>

  <!-- Healthcare App Window -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="12" fill="#091823" stroke="#155e75" stroke-width="2"/>
    
    <!-- Top Header -->
    <rect width="680" height="42" rx="12" fill="#0e2a3b"/>
    <rect y="30" width="680" height="12" fill="#0e2a3b"/>
    <circle cx="25" cy="21" r="6" fill="#ef4444"/>
    <circle cx="45" cy="21" r="6" fill="#eab308"/>
    <circle cx="65" cy="21" r="6" fill="#22c55e"/>

    <!-- Cross logo & title -->
    <g transform="translate(180, 14)">
      <rect x="0" y="5" width="14" height="4" rx="2" fill="#10b981"/>
      <rect x="5" y="0" width="4" height="14" rx="2" fill="#10b981"/>
      <text x="22" y="11" fill="#f0fdfa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">HealthBridge • Pharmacy &amp; Patient Portal</text>
    </g>

    <!-- Main Hero / Search -->
    <g transform="translate(30, 65)">
      <rect width="620" height="90" rx="10" fill="#0d3346" stroke="#0891b2" stroke-width="1"/>
      <text x="30" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Find Essential Medications &amp; Nearest Verified Pharmacies</text>
      <text x="30" y="62" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="12">Direct prescription fulfillment &amp; at-home medication delivery in Addis Ababa</text>
      
      <!-- Search input bar -->
      <rect x="30" y="90" width="450" height="36" rx="6" fill="#07202c" stroke="#155e75"/>
      <text x="45" y="113" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11">Search pharmacy, insulin, antibiotics, pain relief...</text>
      <rect x="490" y="90" width="100" height="36" rx="6" fill="#0ea5e9"/>
      <text x="540" y="113" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Find Now</text>
    </g>

    <!-- 3 Pharmacy Cards -->
    <g transform="translate(30, 215)">
      <!-- Pharmacy 1 -->
      <rect x="0" y="0" width="195" height="150" rx="8" fill="#0c2534" stroke="#155e75"/>
      <circle cx="35" cy="35" r="16" fill="#0284c7" opacity="0.3"/>
      <text x="35" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🏥</text>
      <text x="65" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Bole Meds Plus</text>
      <text x="65" y="48" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="10">Open 24/7 • 1.2 km</text>
      <line x1="15" y1="65" x2="180" y2="65" stroke="#155e75" stroke-width="0.8"/>
      <text x="15" y="85" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">✓ 98% In-Stock Rate</text>
      <text x="15" y="103" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">✓ At-Home Delivery</text>
      <rect x="15" y="118" width="165" height="22" rx="4" fill="#0e7490"/>
      <text x="97" y="133" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Request Prescription</text>

      <!-- Pharmacy 2 -->
      <rect x="212" y="0" width="195" height="150" rx="8" fill="#0c2534" stroke="#155e75"/>
      <circle cx="247" cy="35" r="16" fill="#059669" opacity="0.3"/>
      <text x="247" y="40" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">💊</text>
      <text x="277" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Sarbet HealthCare</text>
      <text x="277" y="48" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="10">Open till 10 PM</text>
      <line x1="227" y1="65" x2="392" y2="65" stroke="#155e75" stroke-width="0.8"/>
      <text x="227" y="85" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">✓ Verified Pharmacist</text>
      <text x="227" y="103" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">✓ Express Pickup</text>
      <rect x="227" y="118" width="165" height="22" rx="4" fill="#0e7490"/>
      <text x="309" y="133" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Request Prescription</text>

      <!-- Pharmacy 3 -->
      <rect x="425" y="0" width="195" height="150" rx="8" fill="#0c2534" stroke="#155e75"/>
      <circle cx="460" cy="35" r="16" fill="#0284c7" opacity="0.3"/>
      <text x="460" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">⚕️</text>
      <text x="490" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">AAiT Community Med</text>
      <text x="490" y="48" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="10">University Hub</text>
      <line x1="440" y1="65" x2="605" y2="65" stroke="#155e75" stroke-width="0.8"/>
      <text x="440" y="85" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">✓ Student &amp; Staff Access</text>
      <text x="440" y="103" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">✓ Direct Consultation</text>
      <rect x="440" y="118" width="165" height="22" rx="4" fill="#0e7490"/>
      <text x="522" y="133" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Request Prescription</text>
    </g>
  </g>
</svg>
